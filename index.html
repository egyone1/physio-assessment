<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Physio Assessment Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: clinic workbench. Top bar + tabs; dashboard grid; visit = region tabs + SOAP tabs + sticky summary rail */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --surface-2:#e9f0ee; --ink:#13222a; --muted:#56676c; --line:#d3dedb;
  --accent:#0d6a5b; --accent-ink:#ffffff; --accent-soft:#d6ebe5;
  --warn:#9a5c06; --warn-soft:#fbeed5; --bad:#b0222b; --bad-soft:#f8e0e0; --good:#21763a; --good-soft:#ddf0e1;
  --s:#2f5f9e; --o:#0d6a5b; --a:#8a4f12; --p:#6b4a9a;
  --paper:#ffffff; --paper-ink:#15202a; --paper-muted:#56656c; --paper-line:#cdd7da; --paper-accent:#0d6a5b;
  --f-display:"Readex Pro",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface-2:#1d2a2e; --ink:#e2ebe9; --muted:#93a5a8; --line:#2a393d;
  --accent:#53c0a7; --accent-ink:#06201a; --accent-soft:#163a32;
  --warn:#e8ab4c; --warn-soft:#382912; --bad:#f08a90; --bad-soft:#3b1b1e; --good:#72d18c; --good-soft:#16321e;
  --s:#86aee6; --o:#53c0a7; --a:#e3a764; --p:#b89ae3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface-2:#1d2a2e; --ink:#e2ebe9; --muted:#93a5a8; --line:#2a393d;
  --accent:#53c0a7; --accent-ink:#06201a; --accent-soft:#163a32;
  --warn:#e8ab4c; --warn-soft:#382912; --bad:#f08a90; --bad-soft:#3b1b1e; --good:#72d18c; --good-soft:#16321e;
  --s:#86aee6; --o:#53c0a7; --a:#e3a764; --p:#b89ae3; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
#app{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:0 100px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill-t{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.pill-t.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:20px 14px}
.page-h h2{font-size:22px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.dash{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f>span{font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],input[type=email],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=number]{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon:disabled{opacity:.35}
.muted{color:var(--muted)}.small{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.test{background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em}
.badge.cond{background:var(--accent-soft);color:var(--accent)}
.badge.req{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.good{background:var(--good-soft);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;min-height:38px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.pos.on{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.neg.on{background:var(--good);border-color:var(--good);color:#fff}
.chip.eq.on{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.sm{padding:4px 11px;min-height:30px;font-size:13px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column;gap:6px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.li.open{border-color:var(--accent)}
.li-h{display:flex;align-items:center;gap:8px;padding:9px 12px;min-width:0}
.li-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-h .t b{font-weight:600;overflow-wrap:anywhere}
.li-h.click{cursor:pointer}
.li-h.click:hover b{color:var(--accent)}
.li-b{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv .icon{width:26px;height:22px;border-radius:5px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-h h3{font-size:15px}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.fh{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
/* dashboard */
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{flex:1;min-width:110px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.due{font-size:12px;font-weight:600}
.due.over{color:var(--bad)}.due.soon{color:var(--warn)}
/* visit */
.visit{display:grid;gap:16px}
@media (min-width:980px){.visit{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.rail{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}}
.regions{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.region{flex:none;min-width:150px;max-width:230px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.region b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.region span{font-size:12px;color:var(--muted)}
.region.on{border-color:var(--accent);background:var(--accent-soft)}
.region.on b{color:var(--accent)}
.region.add{border-style:dashed;color:var(--accent);font-weight:600;justify-content:center;min-width:130px}
.picker{border:1px solid var(--accent);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.pgroup{display:flex;flex-direction:column;gap:6px}
.soap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.soap button{border:0;background:none;border-radius:7px;padding:8px 4px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2}
.soap button i{font-style:normal;font-family:var(--f-mono);font-size:12px}
.soap button small{font-size:11.5px;font-weight:500}
.soap button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.soap button.on i{color:var(--pc)}
.q{padding-block:14px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.q:last-child{border-bottom:0;padding-bottom:0}
.q-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q-l{font-weight:600}
.q-l .star{color:var(--bad)}
.q.appear{animation:appear .35s ease}
@keyframes appear{from{background:var(--accent-soft)}to{background:transparent}}
.help{font-size:13px;color:var(--muted)}
.nprs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;max-width:520px}
.nprs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 0;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.nprs button.on{color:#fff;border-color:transparent}
.nprs-l{display:flex;justify-content:space-between;max-width:520px;font-size:11.5px;color:var(--muted)}
.num{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num input{max-width:140px}
.num span{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.meas-bar{height:5px;width:140px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meas-bar i{display:block;height:100%;background:var(--accent)}
.dx{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dx.ok{border-color:var(--good);background:var(--good-soft)}
.dx-n{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.why{font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.finding{font-size:14px;padding-left:12px;border-left:3px solid var(--a)}
.later{border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.later ul{margin:0;padding-left:18px;columns:2;color:var(--muted);font-size:13.5px}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
.bar .in{max-width:1220px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
/* builder */
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rule-h{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--surface-2)}
.rule-h input{background:transparent;border-color:transparent;font-weight:600;padding-inline:4px}
.rule-h input:focus{background:var(--surface);border-color:var(--line)}
.kw{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;padding:3px 9px;border-radius:5px;display:inline-block}
.kw.if{background:var(--ink);color:var(--bg)}
.kw.then{background:var(--accent);color:var(--accent-ink)}
.rule-b{padding:12px;display:flex;flex-direction:column;gap:10px}
.grp{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cond{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:6px;align-items:center}
@media (max-width:640px){.cond{grid-template-columns:1fr 1fr auto}.cond>:first-child{grid-column:1/-1}}
.joiner{display:flex;justify-content:center}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:var(--f-mono);font-size:12px}
.toggle button{border:0;background:var(--surface);padding:4px 12px;cursor:pointer;color:var(--muted)}
.toggle button.on{background:var(--ink);color:var(--bg)}
.act{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:6px;align-items:center}
@media (max-width:640px){.act{grid-template-columns:1fr auto}.act>:nth-child(2){grid-column:1/-1;grid-row:2}}
.val{border-radius:8px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.val ul{margin:4px 0 0;padding-left:18px}
.addbar{display:flex;gap:6px;flex-wrap:wrap}
.sec-block{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.sec-title{display:flex;gap:8px;align-items:center}
.sec-title input{font-weight:600;max-width:320px}
/* report paper (always light; it is printed) */
.paper-wrap{overflow-x:auto;margin-top:16px}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:794px;margin:0 auto;padding:36px 40px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12);font-family:var(--f-body);font-size:13px;line-height:1.55}
.paper h1{font-size:21px;color:var(--paper-ink)}
.paper h2{font-size:14.5px;color:var(--paper-accent);margin-top:18px;margin-bottom:6px;padding-bottom:4px;border-bottom:1.5px solid var(--paper-accent)}
.paper h3{font-size:12px;margin:12px 0 4px;color:var(--paper-muted);text-transform:uppercase;letter-spacing:.06em}
.paper h4{font-size:13px;margin:8px 0 2px;color:var(--paper-ink)}
.paper .ph-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:3px double var(--paper-line);padding-bottom:12px;flex-wrap:wrap}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{border-bottom:1px solid var(--paper-line);padding:4px 6px;text-align:left;vertical-align:top}
.paper th{font-weight:600;color:var(--paper-muted);width:40%}
.paper .pm{color:var(--paper-muted)}
.paper .tag{display:inline-block;border:1px solid var(--paper-line);border-radius:4px;padding:0 6px;font-size:11px;margin-left:6px}
.paper .pos{color:#a11d25;font-weight:600}.paper .neg{color:#1d6b34}
.paper .note{border:1px solid var(--paper-line);border-radius:6px;padding:8px 10px;margin-top:6px}
.paper .reg{border:1px solid var(--paper-line);border-radius:8px;padding:2px 14px 12px;margin-top:16px}
.paper .sig{display:flex;justify-content:space-between;gap:24px;margin-top:36px;flex-wrap:wrap}
.paper .sig div{border-top:1px solid var(--paper-ink);padding-top:4px;min-width:180px}
.paper .disc{font-size:11px;color:var(--paper-muted);margin-top:18px}
.paper ul{margin:2px 0;padding-left:18px}
.avoid{break-inside:avoid;page-break-inside:avoid}
@media (max-width:600px){.paper{padding:22px 16px}.later ul{columns:1}}
@media print{.top,.bar,.noprint,#toast{display:none!important}html,body{background:#fff}#app{padding:0;max-width:none}.paper-wrap{margin:0}.paper{box-shadow:none;padding:0;max-width:none}}
@media (prefers-reduced-motion:reduce){.q.appear{animation:none}}
</style>
</head>

<div id="app" dir="ltr" lang="en"></div>
<div id="toast" class="toast" hidden></div>

}

/* ----- visit / assessment ----- */
function curRegion() { const v = S.visit; return v?.assessment.regions.find(r => r.id === S.regionId) || v?.assessment.regions[0]; }
function answered(id, reg = curRegion()) { const v = reg?.answers?.[id]; return !(v === undefined || v === '' || (Array.isArray(v) && !v.length)); }
function viewVisit() {

}
function pickerHTML() {

    <label class="f" style="max-width:320px"><span>Or type another area</span><input type="text" id="pk_custom" data-pk="custom" value="${esc(pk.custom)}" placeholder="e.g. Sternoclavicular joint"></label>

function regionHTML(reg) {
  const tpl = tplById(reg.templateId), ev = evaluate(tpl, reg);
  const counts = PARTS.map(([k]) => { const its = ev.items.filter(i => i.part === k); return [its.filter(i => answered(i.id, reg)).length, its.length]; });
  const items = ev.items.filter(i => i.part === S.part);
  const secs = [...(tpl?.sections[S.part] || [])]; items.forEach(i => !secs.includes(i.section) && secs.push(i.section));
  const prev = S.prevVisible, appeared = id => prev.size && !prev.has(id);
  S.prevVisible = ev.visible; S.lastVisKey = [...ev.visible].join(',');
  return `<div class="visit">
    <div class="stack">
      <section class="card stack">

        return `<section class="card"><div class="sec-h"><h3>${esc(sec)}</h3><span class="small muted">${its.filter(i => answered(i.id, reg)).length}/${its.length}</span></div>${its.map(it => qHTML(it, reg, ev, appeared(it.id))).join('')}</section>`; }).join('') || (S.part === 'A' ? '' : `<div class="empty">No fields in ${PARTS.find(p => p[0] === S.part)[1]} for this area.</div>`)}
      ${S.part === 'A' ? `<section class="card stack"><div class="sec-h"><h3>Clinician notes for ${esc(regionName(reg))}</h3></div><textarea id="rg_notes_${reg.id}" data-rg="notes" rows="3">${esc(reg.notes)}</textarea></section>` : ''}

    </div>
    <aside class="card rail stack" id="rail">${railHTML(reg, ev, tpl)}</aside>
  </div>`;
}
function autoFindingsHTML(reg, ev, tpl) {
  return `<section class="card stack"><div class="sec-h"><h3>From the rules</h3><span class="small muted">Updates as you answer</span></div>
    ${ev.warnings.map(w => `<div class="alert warn"><span aria-hidden="true">⚠</span><span>${esc(w)}</span></div>`).join('')}
    <div class="stack" style="gap:6px"><span class="fh">Clinical findings</span>${ev.findings.length ? ev.findings.map(f => `<div class="finding">${esc(f)}</div>`).join('') : `<span class="small muted">None yet.</span>`}</div>
    <div class="stack" style="gap:6px"><span class="fh">Suggested diagnoses</span>${dxHTML(reg, ev, tpl)}</div></section>`;
}
function txHTML(ev) {
  return ev.treatments.length ? `<section class="card stack"><div class="sec-h"><h3>Recommended treatment</h3><span class="small muted">From the findings so far</span></div>
    ${ev.treatments.map(t => `<div class="stack" style="gap:4px"><span class="fh">${esc(t.title)}</span><ul style="margin:0;padding-left:18px">${t.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</section>` : '';
}
function dxHTML(reg, ev, tpl) {

  if (d.np && t.tagName === 'SELECT') { (S.newPt ||= {})[d.np] = t.value; return; }
  if (d.pk && t.tagName === 'SELECT') { S.picker[d.pk] = t.value; return; }
  if (d.pt && t.tagName === 'SELECT') { S.patient[d.pt] = t.value; queueSave('patients', S.patient); return; }
  if (d.vi && t.tagName === 'SELECT') { S.visit[d.vi] = t.value; saveVisit(); return; }
  if (d.vi || d.pt) { render(); return; }
  if (d.rg && t.tagName === 'SELECT') { curRegion()[d.rg] = t.value; saveVisit(); render(); return; }
  if (d.ans) { curRegion().answers[d.ans] = t.value; saveVisit(); refreshRegion(); return; }
  if (d.b && (t.tagName === 'SELECT' || t.type === 'checkbox')) {
    const v = d.t === 'bool' ? t.checked : t.value; setPath(S.cfg, d.b, v);
    const tpl = TPL();
    if (/items\.\d+\.type$/.test(d.b)) { const it = getPath(S.cfg, d.b.replace(/\.type$/, '')); if (['choice','checklist'].includes(v) && !it.options?.length) it.options = ['Option 1', 'Option 2']; if (v === 'test' && !it.options?.length) it.options = ['Positive','Negative','Equivocal']; }
    if (/items\.\d+\.part$/.test(d.b)) { const it = getPath(S.cfg, d.b.replace(/\.part$/, '')); it.section = tpl.sections[v][0] || ''; S.bpart = v; }
    if (/conds\.\d+\.item$/.test(d.b)) { const cd = getPath(S.cfg, d.b.replace(/\.item$/, '')); const ops = OPS_BY[itemIn(tpl, v)?.type] || []; if (!ops.includes(cd.op)) cd.op = ops[0] || 'eq'; cd.value = ''; }
    if (/actions\.\d+\.type$/.test(d.b)) { const ac = getPath(S.cfg, d.b.replace(/\.type$/, '')); ac.target = ''; ac.text = ''; }
    touch(); if (d.rr || d.t === 'bool') render();
  }
});

/* ================= PDF ================= */
let pdfLib;
function loadPdfLib() { return pdfLib ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; s.onload = () => res(window.html2pdf); s.onerror = () => { pdfLib = null; rej(); }; document.head.appendChild(s); }); }
async function makePdf(btn, v) {
  const el = $('#paper'); if (!el || !v) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Preparing…';
  try {
    const h2p = await loadPdfLib(); await document.fonts?.ready;
    const name = (patientOf(v)?.name || 'patient').replace(/[^\p{L}\p{N}]+/gu, '-');
    const opts = {margin:[8, 8, 10, 8], image:{type:'jpeg', quality:0.96}, html2canvas:{scale:2, backgroundColor:'#ffffff', windowWidth:820}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'}, pagebreak:{mode:['css'], avoid:'.avoid'}};
    const filename = `${name}-assessment-${v.date}.pdf`;
    if (S.dl) { const blob = await h2p().set(opts).from(el).outputPdf('blob'); await S.dl.save({filename, data:blob}); }
    else await h2p().set(Object.assign(opts, {filename})).from(el).save();
  } catch (err) { if (err?.code !== 'declined') toast('Couldn’t create the PDF, try again'); }
  btn.disabled = false; btn.textContent = old;
}

boot();
</script>
