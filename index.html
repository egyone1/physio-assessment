<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Physio Assessment Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: clinic workbench. Top bar + tabs; dashboard grid; visit = region tabs + SOAP tabs + sticky summary rail */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --surface-2:#e9f0ee; --ink:#13222a; --muted:#56676c; --line:#d3dedb;
  --accent:#0d6a5b; --accent-ink:#ffffff; --accent-soft:#d6ebe5;
  --warn:#9a5c06; --warn-soft:#fbeed5; --bad:#b0222b; --bad-soft:#f8e0e0; --good:#21763a; --good-soft:#ddf0e1;
  --s:#2f5f9e; --o:#0d6a5b; --a:#8a4f12; --p:#6b4a9a;
  --paper:#ffffff; --paper-ink:#15202a; --paper-muted:#56656c; --paper-line:#cdd7da; --paper-accent:#0d6a5b;
  --f-display:"Readex Pro",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface-2:#1d2a2e; --ink:#e2ebe9; --muted:#93a5a8; --line:#2a393d;
  --accent:#53c0a7; --accent-ink:#06201a; --accent-soft:#163a32;
  --warn:#e8ab4c; --warn-soft:#382912; --bad:#f08a90; --bad-soft:#3b1b1e; --good:#72d18c; --good-soft:#16321e;
  --s:#86aee6; --o:#53c0a7; --a:#e3a764; --p:#b89ae3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface-2:#1d2a2e; --ink:#e2ebe9; --muted:#93a5a8; --line:#2a393d;
  --accent:#53c0a7; --accent-ink:#06201a; --accent-soft:#163a32;
  --warn:#e8ab4c; --warn-soft:#382912; --bad:#f08a90; --bad-soft:#3b1b1e; --good:#72d18c; --good-soft:#16321e;
  --s:#86aee6; --o:#53c0a7; --a:#e3a764; --p:#b89ae3; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
#app{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:0 100px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill-t{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.pill-t.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:20px 14px}
.page-h h2{font-size:22px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.dash{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f>span{font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],input[type=email],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=number]{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon:disabled{opacity:.35}
.muted{color:var(--muted)}.small{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.test{background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em}
.badge.cond{background:var(--accent-soft);color:var(--accent)}
.badge.req{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.good{background:var(--good-soft);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;min-height:38px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.pos.on{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.neg.on{background:var(--good);border-color:var(--good);color:#fff}
.chip.eq.on{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.sm{padding:4px 11px;min-height:30px;font-size:13px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column;gap:6px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.li.open{border-color:var(--accent)}
.li-h{display:flex;align-items:center;gap:8px;padding:9px 12px;min-width:0}
.li-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-h .t b{font-weight:600;overflow-wrap:anywhere}
.li-h.click{cursor:pointer}
.li-h.click:hover b{color:var(--accent)}
.li-b{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv .icon{width:26px;height:22px;border-radius:5px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-h h3{font-size:15px}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.fh{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
/* dashboard */
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{flex:1;min-width:110px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.due{font-size:12px;font-weight:600}
.due.over{color:var(--bad)}.due.soon{color:var(--warn)}
/* visit */
.visit{display:grid;gap:16px}
@media (min-width:980px){.visit{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.rail{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}}
.regions{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.region{flex:none;min-width:150px;max-width:230px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.region b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.region span{font-size:12px;color:var(--muted)}
.region.on{border-color:var(--accent);background:var(--accent-soft)}
.region.on b{color:var(--accent)}
.region.add{border-style:dashed;color:var(--accent);font-weight:600;justify-content:center;min-width:130px}
.picker{border:1px solid var(--accent);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.pgroup{display:flex;flex-direction:column;gap:6px}
.soap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.soap button{border:0;background:none;border-radius:7px;padding:8px 4px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2}
.soap button i{font-style:normal;font-family:var(--f-mono);font-size:12px}
.soap button small{font-size:11.5px;font-weight:500}
.soap button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.soap button.on i{color:var(--pc)}
.q{padding-block:14px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.q:last-child{border-bottom:0;padding-bottom:0}
.q-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q-l{font-weight:600}
.q-l .star{color:var(--bad)}
.q.appear{animation:appear .35s ease}
@keyframes appear{from{background:var(--accent-soft)}to{background:transparent}}
.help{font-size:13px;color:var(--muted)}
.nprs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;max-width:520px}
.nprs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 0;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.nprs button.on{color:#fff;border-color:transparent}
.nprs-l{display:flex;justify-content:space-between;max-width:520px;font-size:11.5px;color:var(--muted)}
.num{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num input{max-width:140px}
.num span{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.meas-bar{height:5px;width:140px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meas-bar i{display:block;height:100%;background:var(--accent)}
.dx{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dx.ok{border-color:var(--good);background:var(--good-soft)}
.dx-n{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.why{font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.finding{font-size:14px;padding-left:12px;border-left:3px solid var(--a)}
.later{border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.later ul{margin:0;padding-left:18px;columns:2;color:var(--muted);font-size:13.5px}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
.bar .in{max-width:1220px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
/* builder */
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rule-h{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--surface-2)}
.rule-h input{background:transparent;border-color:transparent;font-weight:600;padding-inline:4px}
.rule-h input:focus{background:var(--surface);border-color:var(--line)}
.kw{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;padding:3px 9px;border-radius:5px;display:inline-block}
.kw.if{background:var(--ink);color:var(--bg)}
.kw.then{background:var(--accent);color:var(--accent-ink)}
.rule-b{padding:12px;display:flex;flex-direction:column;gap:10px}
.grp{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cond{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:6px;align-items:center}
@media (max-width:640px){.cond{grid-template-columns:1fr 1fr auto}.cond>:first-child{grid-column:1/-1}}
.joiner{display:flex;justify-content:center}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:var(--f-mono);font-size:12px}
.toggle button{border:0;background:var(--surface);padding:4px 12px;cursor:pointer;color:var(--muted)}
.toggle button.on{background:var(--ink);color:var(--bg)}
.act{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:6px;align-items:center}
@media (max-width:640px){.act{grid-template-columns:1fr auto}.act>:nth-child(2){grid-column:1/-1;grid-row:2}}
.val{border-radius:8px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.val ul{margin:4px 0 0;padding-left:18px}
.addbar{display:flex;gap:6px;flex-wrap:wrap}
.sec-block{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.sec-title{display:flex;gap:8px;align-items:center}
.sec-title input{font-weight:600;max-width:320px}
/* report paper (always light; it is printed) */
.paper-wrap{overflow-x:auto;margin-top:16px}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:794px;margin:0 auto;padding:36px 40px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12);font-family:var(--f-body);font-size:13px;line-height:1.55}
.paper h1{font-size:21px;color:var(--paper-ink)}
.paper h2{font-size:14.5px;color:var(--paper-accent);margin-top:18px;margin-bottom:6px;padding-bottom:4px;border-bottom:1.5px solid var(--paper-accent)}
.paper h3{font-size:12px;margin:12px 0 4px;color:var(--paper-muted);text-transform:uppercase;letter-spacing:.06em}
.paper h4{font-size:13px;margin:8px 0 2px;color:var(--paper-ink)}
.paper .ph-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:3px double var(--paper-line);padding-bottom:12px;flex-wrap:wrap}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{border-bottom:1px solid var(--paper-line);padding:4px 6px;text-align:left;vertical-align:top}
.paper th{font-weight:600;color:var(--paper-muted);width:40%}
.paper .pm{color:var(--paper-muted)}
.paper .tag{display:inline-block;border:1px solid var(--paper-line);border-radius:4px;padding:0 6px;font-size:11px;margin-left:6px}
.paper .pos{color:#a11d25;font-weight:600}.paper .neg{color:#1d6b34}
.paper .note{border:1px solid var(--paper-line);border-radius:6px;padding:8px 10px;margin-top:6px}
.paper .reg{border:1px solid var(--paper-line);border-radius:8px;padding:2px 14px 12px;margin-top:16px}
.paper .sig{display:flex;justify-content:space-between;gap:24px;margin-top:36px;flex-wrap:wrap}
.paper .sig div{border-top:1px solid var(--paper-ink);padding-top:4px;min-width:180px}
.paper .disc{font-size:11px;color:var(--paper-muted);margin-top:18px}
.paper ul{margin:2px 0;padding-left:18px}
.avoid{break-inside:avoid;page-break-inside:avoid}
@media (max-width:600px){.paper{padding:22px 16px}.later ul{columns:1}}
@page{size:A4;margin:12mm}
@media print{.paper tr,.paper li,.paper h2,.paper h3,.paper h4{break-inside:avoid}.paper h2,.paper h3,.paper h4{break-after:avoid}.paper .reg{border:0;padding:0}.top,.bar,.noprint,#toast{display:none!important}html,body{background:#fff}#app{padding:0;max-width:none}.paper-wrap{margin:0}.paper{box-shadow:none;padding:0;max-width:none}}
@media (prefers-reduced-motion:reduce){.q.appear{animation:none}}
/* ---- visual refresh ---- */
:root{--bg:#f3f6f7;--surface-2:#edf2f3;--line:#e0e7e9;--accent:#0b7a6b;--accent-2:#16a38c;--accent-soft:#dff3ee;--r:16px;--shadow:0 1px 2px rgba(16,40,48,.05),0 10px 28px -14px rgba(16,40,48,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent-2:#7fd6c0;--shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--accent-2:#7fd6c0;--shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.7)}
body{-webkit-font-smoothing:antialiased}
.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding-block:14px 10px}
.brand h1{font-size:19px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 14px -6px var(--accent)}
.tabs{gap:6px;margin-top:12px}
.tab{border-bottom:0;border-radius:999px;padding:8px 16px;transition:background .15s,color .15s}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--ink);color:var(--bg)}
.page-h{margin-block:26px 16px}
.page-h h2{font-size:27px;letter-spacing:-.02em}
.card{border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.sec-h{padding-bottom:10px}
.sec-h h3{font-size:16px}
.btn{border-radius:11px;padding:9px 16px;transition:border-color .15s,transform .05s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:0 8px 18px -10px var(--accent)}
.btn.sm{padding:6px 12px;border-radius:9px}
.btn.sm.pri{box-shadow:none}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],input[type=email],select,textarea{border-radius:11px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{border-radius:12px;padding:8px 15px;transition:border-color .12s,background .12s,transform .05s}
.chip:hover{border-color:var(--accent)}
.chip:active{transform:scale(.97)}
.chip.sm{border-radius:10px}
.kpi div{border-radius:14px;padding:12px 14px}
.kpi b{font-size:26px}
.li{border-radius:13px;transition:border-color .15s}
.li:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.alert{border-radius:13px;padding:12px 14px;align-items:center;justify-content:space-between}
.soap{border-radius:14px;padding:5px}
.soap button{border-radius:10px;padding:9px 4px}
.region{border-radius:14px;padding:10px 14px}
.region span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{border-radius:var(--r)}
.bar{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.toast{border-radius:12px;box-shadow:var(--shadow)}
.meter{height:7px}
.meter i{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:9px}
.dx{border-radius:13px;padding:12px 14px}
.dx.top{border-color:var(--accent);background:var(--accent-soft)}
.dx.ok{border-color:var(--good)}
.uses{font-size:12px;color:var(--muted);opacity:.85}
/* answers sit two-up on wide screens so a section fits on one screen */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));column-gap:28px}
.qgrid .q.wide{grid-column:1/-1}
.qgrid .q:last-child{border-bottom:1px dashed var(--line);padding-bottom:14px}
.cond.ev{grid-template-columns:minmax(0,2fr) minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.1fr) auto}
@media (max-width:640px){.cond.ev{grid-template-columns:1fr 1fr auto}.cond.ev>:first-child{grid-column:1/-1}}
/* ---- compact visit: one section open at a time ---- */
:root{--f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif}
.stack.tight{gap:8px}
.visit{gap:12px}
.visit .card{padding:14px 16px}
.sec{padding:0!important;overflow:hidden;scroll-margin:120px 0 90px}
.sec-t{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;background:none;cursor:pointer;text-align:start;color:inherit}
.sec-t b{flex:1;font-family:var(--f-display);font-size:15px;font-weight:600}
.sec-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);flex:none}
.sec-n.part{background:var(--warn-soft);color:var(--warn)}
.sec-n.done{background:var(--good-soft);color:var(--good)}
.chev{color:var(--muted)}
.sec.open{border-color:var(--accent)}
.sec.open .sec-t{border-bottom:1px solid var(--line)}
.sec .qgrid{padding:0 14px}
.sec-f{padding:8px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.secnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.secnav .chip{flex:none;min-height:30px;padding:4px 12px}
.q{padding-block:9px;gap:6px}
.qgrid .q:last-child{padding-bottom:9px}
.help{font-size:12.5px;line-height:1.4}
.chip{min-height:34px;padding:6px 13px}
.uses{font-size:11.5px}
.nprs button{padding:6px 0}
.rail{gap:10px}
/* ---- tighter layout, colour by SOAP part ---- */
body{font-size:14.5px;line-height:1.45}
#app{padding-bottom:84px}
.top{padding-block:10px 8px}
.tabs{margin-top:8px}
.tab{padding:6px 14px}
.page-h{margin-block:14px 10px}

.card{padding:14px}
.stack{gap:10px}
.dash{gap:12px}

.vd{padding:10px 14px}
.regions{gap:6px;padding-bottom:0}
.region{min-width:120px;padding:7px 12px;border-radius:12px}

.visit .card{padding:10px 12px}

.secnav .chip.on{background:var(--pc);border-color:var(--pc);color:#fff}
.sec{overflow:visible;border-inline-start:4px solid color-mix(in srgb,var(--pc) 35%,transparent)}
.sec.open{border-color:var(--pc)}
.sec-t{padding:7px 12px}
.sec.open .sec-t{background:color-mix(in srgb,var(--pc) 9%,transparent)}
.sec-n{width:22px;height:22px;background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--pc)}
.sec .qgrid{padding:0 12px;column-gap:20px}
.sec-f{padding:6px 12px;border-radius:0 0 var(--r) var(--r)}
.q{padding-block:6px;gap:5px}
.qgrid .q:last-child{padding-bottom:6px}
.q-l{font-size:14px}
.chips{gap:5px}
.chip{min-height:30px;padding:4px 11px;border-radius:10px;font-size:13.5px}
.nprs button{padding:4px 0}
.nprs-l{display:none}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],input[type=email],select,textarea{padding:7px 10px}
textarea{min-height:44px}
.num input{max-width:110px}
.badge.test{font-size:9.5px;padding:1px 6px}
.hint{position:relative}
.hint summary{list-style:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;font-style:italic;color:var(--muted);cursor:pointer}
.hint summary::-webkit-details-marker{display:none}
.hint[open] summary{background:var(--pc);border-color:var(--pc);color:#fff}
.hint>div{position:absolute;inset-inline-end:0;top:25px;z-index:6;width:min(300px,78vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.4;color:var(--muted);text-align:start}
.dx{padding:9px 12px;gap:5px}
.dxw>span{font-weight:700;color:var(--ink);font-size:14px}
.dxw textarea{font-size:16px;min-height:84px;border:2px solid var(--a);background:color-mix(in srgb,var(--a) 6%,var(--surface))}
.alert{padding:8px 12px}
.finding{padding-left:10px}
.rail{gap:8px}
.bar{padding-block:7px}
.bar .btn{padding:7px 14px}
/* ---- one pill style for every choice: light when off, solid when chosen ---- */
.pills{gap:6px;align-items:center}
.pill-t,.chip,.region{border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-weight:600;padding:5px 14px;min-height:32px;font-size:13.5px;line-height:1.3;transition:background .12s,color .12s,border-color .12s}
.pill-t:hover,.chip:hover,.region:hover{border-color:var(--ink);color:var(--ink)}
.pill-t.on,.chip.on,.region.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{padding:3px 12px;min-height:28px;border-radius:999px}
.chip.pos.on{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.neg.on{background:var(--good);border-color:var(--good);color:#fff}
.chip.eq.on{background:var(--warn);border-color:var(--warn);color:#fff}
.secnav .chip.on{background:var(--pc);border-color:var(--pc);color:#fff}
.regions{flex-wrap:wrap;overflow:visible}
.region{flex-direction:row;align-items:baseline;gap:8px;min-width:0;max-width:none}
.region b{font-weight:600;color:inherit}
.region.on b{color:inherit}
.region span{font-size:11.5px;font-weight:500;color:inherit;opacity:.7;max-width:150px}
.region.add{border-style:dashed;color:var(--accent);min-width:0}
.nprs button{border-radius:999px}
/* ---- express screen and plan ---- */
.visit.one{display:block}
.xp{border-inline-start:4px solid var(--pc)}
.xh{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--pc)}
.tip{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.check.tx{align-items:flex-start;gap:8px;padding:3px 0;font-size:13.5px;line-height:1.4}
.check.tx input{margin-top:3px;flex:none;accent-color:var(--p)}
.check.tx input:checked+span{font-weight:600}
.toggle button{padding:4px 10px}

const PSEUDO = () => [{id:'_area', type:'choice', label:'Region › body area', options:S.cfg.bodyAreas.map(a => a.name)}, {id:'_side', type:'choice', label:'Region › side', options:SIDES}];

function testCond(c, ans, visible) {
  if (!c.item) return false;
  const v = (c.item[0] === '_' || visible.has(c.item)) ? ans[c.item] : undefined;
  const empty = v === undefined || v === '' || (Array.isArray(v) && !v.length);
  if (c.op === 'empty') return empty;
  if (empty) return false;
  if (c.op === 'answered') return true;
  const want = c.value ?? '';
  if (c.op === 'has') return Array.isArray(v) ? v.includes(want) : String(v).toLowerCase().includes(String(want).toLowerCase());
  if (c.op === 'nhas') return Array.isArray(v) ? !v.includes(want) : !String(v).toLowerCase().includes(String(want).toLowerCase());

    case 'neq': return numeric ? a !== b : String(v) !== String(want);

  const res = groups.map(g => g.logic === 'or' ? g.conds.some(c => testCond(c, ans, visible)) : g.conds.every(c => testCond(c, ans, visible)));

function evaluate(tpl, region) {

  if (!tpl) return out;
  const ans = Object.assign({}, region?.answers || {}, {_area:region?.area || '', _side:region?.side || ''});
  tpl.rules.forEach(r => (r.actions || []).forEach(a => a.type === 'show' && a.target && out.conditional.add(a.target)));
  const inArea = tpl.items.filter(i => !region?.area || !i.areas?.length || i.areas.includes(region.area)).map(i => i.id);
  const inSet = new Set(inArea), base = inArea.filter(id => !out.conditional.has(id));

    fired = tpl.rules.filter(r => testRule(r, ans, visible));
    const next = new Set(base);
    fired.forEach(r => r.actions.forEach(a => a.type === 'show' && inSet.has(a.target) && next.add(a.target)));
    fired.forEach(r => r.actions.forEach(a => a.type === 'hide' && next.delete(a.target)));

    visible = next; if (same) break;
  }
  out.visible = visible; out.fired = fired;
  fired.forEach(r => r.actions.forEach(a => {
    if (a.type === 'diagnosis' && a.target) { const d = out.dx.get(a.target) || {rules:[]}; d.rules.push(r); out.dx.set(a.target, d); }
    if (a.type === 'warning' && a.text && !out.warnings.includes(a.text)) out.warnings.push(a.text);
    if (a.type === 'finding' && a.text && !out.findings.includes(a.text)) out.findings.push(a.text);
    if (a.type === 'treatment' && a.text) {
      const title = tpl.diagnoses.find(d => d.id === r.actions.find(x => x.type === 'diagnosis')?.target)?.name || r.name || 'Treatment';
      let g = out.treatments.find(t => t.title === title); if (!g) out.treatments.push(g = {title, items:[]});

    return {d, score, met, why, against};
  }).filter(x => x.score > 0 || x.met).sort((a, b) => b.score - a.score);

}
function condText(tpl, c) {
  const it = itemIn(tpl, c.item);

}
function validate(tpl) {
  const w = [], ids = new Set(tpl.items.map(i => i.id).concat(['_area', '_side']));
  tpl.rules.forEach(r => {
    const n = r.name || 'Untitled rule';
    if (!(r.actions || []).length) w.push(`“${n}” has no THEN action.`);
    if (!(r.groups || []).some(g => g.conds?.length)) w.push(`“${n}” has no IF condition.`);
    (r.groups || []).forEach(g => g.conds.forEach(c => !ids.has(c.item) && w.push(`“${n}” depends on a field that no longer exists.`)));
    (r.actions || []).forEach(a => {
      if (['show','hide','require'].includes(a.type) && !ids.has(a.target)) w.push(`“${n}” targets a field that no longer exists.`);
      if (a.type === 'diagnosis' && !tpl.diagnoses.some(d => d.id === a.target)) w.push(`“${n}” suggests a diagnosis that no longer exists.`);
      if (['warning','finding','treatment'].includes(a.type) && !a.text?.trim()) w.push(`“${n}” has an empty ${a.type} message.`);

  tpl.diagnoses.forEach(d => !d.evidence?.length && !tpl.rules.some(r => r.actions?.some(a => a.type === 'diagnosis' && a.target === d.id)) && w.push(`Diagnosis “${d.name}” has no evidence and no criteria rule, so it can never be suggested.`));

function getPath(o, path) { return path.split('.').reduce((a, k) => a?.[k], o); }
function setPath(o, path, v) { const ks = path.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k] ??= {}, o)[last] = v; }
let toastT; function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }
let armT; function arm(key, fn) { if (S.arm === key) { S.arm = null; fn(); } else { S.arm = key; clearTimeout(armT); armT = setTimeout(() => { S.arm = null; render(); }, 3500); } render(); }
const TPL = () => S.cfg.templates.find(t => t.id === S.tplId);

function sameGroupNeighbor(arr, i, d, key) { let j = i + d; while (j >= 0 && j < arr.length && key(arr[j]) !== key(arr[i])) j += d; return j >= 0 && j < arr.length ? j : -1; }

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset, tpl = TPL();
  if (a !== 'confirm' && a !== 'txTick' && b.tagName !== 'INPUT') e.preventDefault();
  switch (a) {

    case 'setRg': { const r = curRegion(); r[d.k] = r[d.k] === d.v ? '' : d.v; saveVisit(); render(); break; }

    case 'subAdd': { const u = S.users.find(x => x.uid === d.id), s = S.subs[d.id], e = new Date(s?.active && s.expires > Date.now() ? s.expires : Date.now()); e.setMonth(e.getMonth() + +d.v);
      try { await S.fdb.collection('subscriptions').doc(d.id).set({active:true, expires:e.getTime(), email:u?.email || '', updatedAt:Date.now()}); toast('Active until ' + fmtMs(e.getTime())); } catch (err) { toast(failMsg(err)); } break; }
    case 'subOff': arm('sub' + d.id, async () => { try { await S.fdb.collection('subscriptions').doc(d.id).set({active:false, updatedAt:Date.now()}, {merge:true}); toast('Subscription deactivated'); } catch (err) { toast(failMsg(err)); } }); break;
    case 'go': if (d.v === 'patients' || d.v === 'newvisit') S.q = ''; go(d.v); break;
    case 'openPatient': go('patient', d.id); break;
    case 'openVisit': go('visit', d.id); break;
    case 'openReport': go('report', d.id); break;
    case 'editTpl': S.tplId = d.id; go('builder'); break;
    case 'startVisit': { const p = S.patients.find(x => x.id === d.id); if (p) { const v = newVisitFor(p); go('visit', v.id, {visit:v}); } break; }
    case 'followUp': { const prev = S.visits.find(x => x.id === d.id), p = patientOf(prev); if (p) { const v = newVisitFor(p, prev); go('visit', v.id, {visit:v}); toast('Regions copied from the last visit'); } break; }
    case 'createPatient': {
      const n = S.newPt || {}; if (!n.name?.trim()) { toast('Enter the patient’s name first'); $('#np_name')?.focus(); return; }
      const p = {id:uid('p'), name:n.name.trim(), age:n.age || '', sex:n.sex || '', phone:n.phone || '', email:'', address:'', dob:'', occupation:'', referral:'', registered:today(), pmh:'', surgery:'', meds:'', notes:'', createdAt:Date.now()};
      queueSave('patients', p, 0); S.newPt = null; const v = newVisitFor(p); go('visit', v.id, {visit:v}); break; }
    case 'delPatient': arm('p' + d.id, async () => { try { for (const v of S.visits.filter(x => x.patientId === d.id)) await deleteDoc('visits', v.id); await deleteDoc('patients', d.id); S.visits = S.visits.filter(x => x.patientId !== d.id); S.patients = S.patients.filter(x => x.id !== d.id); toast('Patient deleted'); go('patients'); } catch (err) { toast(failMsg(err)); } }); break;

    case 'addSec': { const v = $('#newsec').value.trim(); if (!v || tpl.sections[S.bpart].includes(v)) return; tpl.sections[S.bpart].push(v); touch(); render(); break; }
    case 'delSec': arm('sec' + S.bpart + d.i, () => { tpl.sections[S.bpart].splice(+d.i, 1); touch(); }); break;
    case 'addItem': { const t = d.t, it = {id:uid(t === 'test' ? 't' : 'f'), type:t, label:t === 'test' ? 'New special test' : 'New ' + TYPES[t].toLowerCase(), part:S.bpart, section:d.sec, options:t === 'test' ? ['Positive','Negative','Equivocal'] : ['choice','checklist'].includes(t) ? ['Option 1','Option 2'] : [], unit:t === 'measurement' ? '°' : t === 'scale' ? '/10' : '', normal:'', required:false, areas:[], help:''};
      let at = -1; tpl.items.forEach((x, k) => { if (x.part === it.part && x.section === it.section) at = k; }); tpl.items.splice(at < 0 ? tpl.items.length : at + 1, 0, it);
      S.open = it.id; touch(); render(); setTimeout(() => { const i = tpl.items.indexOf(it); const el = document.getElementById(`templates.${S.cfg.templates.indexOf(tpl)}.items.${i}.label`); el?.focus(); el?.select(); el?.scrollIntoView({block:'center'}); }, 20); break; }
    case 'dupItem': { const src = tpl.items[+d.i], it = Object.assign(clone(src), {id:uid('f'), label:src.label + ' (copy)'}); tpl.items.splice(+d.i + 1, 0, it); S.open = it.id; touch(); render(); break; }
    case 'delItem': arm('it' + tpl.items[+d.i].id, () => { tpl.items.splice(+d.i, 1); S.open = null; touch(); }); break;
    case 'itemArea': { const it = tpl.items[+d.i]; it.areas ||= []; const k = it.areas.indexOf(d.v); k < 0 ? it.areas.push(d.v) : it.areas.splice(k, 1); touch(); render(); break; }
    case 'ruleFor': { const it = tpl.items.find(x => x.id === d.id); addRuleAndGo(newRule('Show “' + it.label + '”', [{item:'', op:'eq', value:''}], [{type:'show', target:it.id}])); break; }
    case 'addRule': addRuleAndGo(newRule('New rule', [{item:'', op:'eq', value:''}], [{type:'show', target:''}])); break;
    case 'delRule': arm('ru' + tpl.rules[+d.i].id, () => { tpl.rules.splice(+d.i, 1); touch(); }); break;
    case 'setv': setPath(S.cfg, d.path, d.v); touch(); render(); break;
    case 'addCond': tpl.rules[+d.r].groups[+d.g].conds.push({item:'', op:'eq', value:''}); touch(); render(); break;
    case 'delCond': { const r = tpl.rules[+d.r], g = r.groups[+d.g]; g.conds.splice(+d.c, 1); if (!g.conds.length && r.groups.length > 1) r.groups.splice(+d.g, 1); touch(); render(); break; }
    case 'addGroup': tpl.rules[+d.r].groups.push({logic:'and', conds:[{item:'', op:'eq', value:''}]}); touch(); render(); break;
    case 'delGroup': tpl.rules[+d.r].groups.splice(+d.g, 1); touch(); render(); break;
    case 'addAct': tpl.rules[+d.r].actions.push({type:'show', target:''}); touch(); render(); break;
    case 'delAct': tpl.rules[+d.r].actions.splice(+d.a, 1); touch(); render(); break;
    case 'addDx': { const nd = {id:uid('d'), name:'New diagnosis', code:'', evidence:[], treatment:[]}; tpl.diagnoses.push(nd); S.open = 'dx_' + nd.id; touch(); render(); break; }
    case 'addEv': tpl.diagnoses[+d.i].evidence.push({item:'', op:'eq', value:'', w:2}); touch(); render(); break;
    case 'delEv': tpl.diagnoses[+d.i].evidence.splice(+d.e, 1); touch(); render(); break;
    case 'allNeg': { const r = curRegion(), ev = evaluate(tplById(r.templateId), r);
      ev.items.filter(i => i.type === 'test' && i.part === S.part && i.section === d.sec && !answered(i.id, r) && (!S.quick || i.quick || ev.required.has(i.id))).forEach(i => { const n = optionsOf(i).find(o => /^neg/i.test(o)); if (n) r.answers[i.id] = n; });
      saveVisit(); render(); break; }
    case 'delDx': arm('dx' + tpl.diagnoses[+d.i].id, () => { tpl.diagnoses.splice(+d.i, 1); touch(); }); break;
    case 'ruleForDx': { const dx = tpl.diagnoses.find(x => x.id === d.id); addRuleAndGo(newRule('Criteria: ' + dx.name, [{item:'', op:'eq', value:''}], [{type:'diagnosis', target:dx.id}])); break; }
    case 'gotoRule': S.btab = 'rules'; render(); setTimeout(() => $('#rule_' + d.id)?.scrollIntoView({block:'start', behavior:'smooth'}), 30); break;
    /* settings */
    case 'addArea': { const n = $('#na_name').value.trim(), g = $('#na_group').value.trim() || 'Other'; if (!n || S.cfg.bodyAreas.some(x => x.name === n)) return; S.cfg.bodyAreas.push({name:n, group:g}); touch(); render(); break; }
    case 'delArea': S.cfg.bodyAreas.splice(+d.i, 1); touch(); render(); break;
    case 'loadExample': arm('example', () => { S.cfg.templates = normalize(clone(EXAMPLE)).templates; S.tplId = S.cfg.templates[0].id; touch(); toast('Example templates restored'); }); break;
    case 'export': {
      const json = JSON.stringify(S.cfg, null, 2);
      try { if (S.dl) await S.dl.save({filename:'assessment-templates.json', data:json});
        else { const u = URL.createObjectURL(new Blob([json], {type:'application/json'})); const l = document.createElement('a'); l.href = u; l.download = 'assessment-templates.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); }
      } catch (err) { if (err?.code !== 'declined') toast('Export failed'); }
      break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.q !== undefined) { S.q = t.value; render(); return; }
  if (d.np) { (S.newPt ||= {})[d.np] = t.value; return; }
  if (d.pk) { S.picker[d.pk] = t.value; if (d.pk === 'custom') { clearTimeout(t._t); t._t = setTimeout(render, 300); } return; }
  if (d.pt && t.tagName !== 'SELECT') { S.patient[d.pt] = t.value; queueSave('patients', S.patient, 900); return; }
  if (d.vi && t.tagName !== 'SELECT') { S.visit[d.vi] = t.value; saveVisit(); return; }
  if (d.rg && t.tagName !== 'SELECT') { curRegion()[d.rg] = t.value; saveVisit(); return; }
  if (d.ans) { curRegion().answers[d.ans] = t.value; saveVisit(); clearTimeout(t._t); t._t = setTimeout(refreshRegion, 350); return; }
  if (d.b && t.tagName !== 'SELECT' && t.type !== 'checkbox') {
    let v = t.value; if (d.t === 'lines') v = v.split('\n').map(s => s.trim()).filter(Boolean);
    if (d.rename !== undefined) { const old = d.rename; TPL()?.items.forEach(i => i.part === S.bpart && i.section === old && (i.section = v)); d.rename = v; }
    setPath(S.cfg, d.b, v); touch();
    if (d.b === 'clinic.name') { const h = $('.brand h1'); if (h) h.lastChild.textContent = v || 'Physio Assessment'; }
  }
});
document.addEventListener('toggle', e => { if (e.target.classList?.contains('vd')) S.vd = e.target.open; }, true);
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.dxpick !== undefined) { if (t.value) { const r = curRegion(); (r.confirmed ||= {})[t.value] = true; saveVisit(); render(); } return; }
  if (t.id === 'imp' && t.files?.[0]) {
    const fr = new FileReader(); fr.onload = () => { try { const j = JSON.parse(fr.result); if (!Array.isArray(j.templates)) throw 0; S.cfg.templates = normalize(j).templates; S.tplId = S.cfg.templates[0]?.id; touch(); toast('Templates imported'); render(); } catch { toast('That file isn’t a templates export from this app'); } }; fr.readAsText(t.files[0]); t.value = ''; return;
  }
  if (d.np && t.tagName === 'SELECT') { (S.newPt ||= {})[d.np] = t.value; return; }
  if (d.pk && t.tagName === 'SELECT') { S.picker[d.pk] = t.value; return; }
  if (d.pt && t.tagName === 'SELECT') { S.patient[d.pt] = t.value; queueSave('patients', S.patient); return; }
  if (d.vi && t.tagName === 'SELECT') { S.visit[d.vi] = t.value; saveVisit(); return; }
  if (d.vi || d.pt) { render(); return; }
  if (d.rg && t.tagName === 'SELECT') { curRegion()[d.rg] = t.value; saveVisit(); render(); return; }
  if (d.ans) { curRegion().answers[d.ans] = t.value; saveVisit(); refreshRegion(); return; }
  if (d.b && (t.tagName === 'SELECT' || t.type === 'checkbox')) {
    const v = d.t === 'bool' ? t.checked : t.value; setPath(S.cfg, d.b, v);
    const tpl = TPL();
    if (/items\.\d+\.type$/.test(d.b)) { const it = getPath(S.cfg, d.b.replace(/\.type$/, '')); if (['choice','checklist'].includes(v) && !it.options?.length) it.options = ['Option 1', 'Option 2']; if (v === 'test' && !it.options?.length) it.options = ['Positive','Negative','Equivocal']; }
    if (/items\.\d+\.part$/.test(d.b)) { const it = getPath(S.cfg, d.b.replace(/\.part$/, '')); it.section = tpl.sections[v][0] || ''; S.bpart = v; }
    if (/(conds|evidence)\.\d+\.item$/.test(d.b)) { const cd = getPath(S.cfg, d.b.replace(/\.item$/, '')); const ops = OPS_BY[itemIn(tpl, v)?.type] || []; if (!ops.includes(cd.op)) cd.op = ops[0] || 'eq'; cd.value = ''; }
    if (/actions\.\d+\.type$/.test(d.b)) { const ac = getPath(S.cfg, d.b.replace(/\.type$/, '')); ac.target = ''; ac.text = ''; }
    touch(); if (d.rr || d.t === 'bool') render();
  }
});

/* ================= PDF ================= */
let pdfLib;
function loadPdfLib() { return pdfLib ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; s.onload = () => res(window.html2pdf); s.onerror = () => { pdfLib = null; rej(); }; document.head.appendChild(s); }); }
/* The file is rendered from an A4-wide copy so it looks the same on a phone, and the scale drops for long reports so the canvas stays within browser limits. */
async function makePdf(btn, v) {
  const el = $('#paper'); if (!el || !v) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Preparing…';
  const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:0;top:0;width:794px;opacity:0;pointer-events:none;z-index:-1';
  const copy = el.cloneNode(true); copy.removeAttribute('id'); copy.style.cssText = 'width:794px;max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0';
  box.appendChild(copy); document.body.appendChild(box);
  try {
    const h2p = await loadPdfLib(); await document.fonts?.ready;
    const name = (patientOf(v)?.name || 'patient').replace(/[^\p{L}\p{N}]+/gu, '-');
    const scale = Math.max(1, Math.min(2, Math.sqrt(12e6 / (794 * Math.max(copy.scrollHeight, 1)))));
    const opts = {margin:[10, 10, 12, 10], image:{type:'jpeg', quality:0.95}, html2canvas:{scale, backgroundColor:'#ffffff', windowWidth:794, scrollX:0, scrollY:0}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'}, pagebreak:{mode:['css', 'legacy'], avoid:['tr', 'li', 'h2', 'h3', 'h4', '.avoid']}};
    const filename = `${name}-assessment-${v.date}.pdf`;
    if (S.dl) { const blob = await h2p().set(opts).from(copy).outputPdf('blob'); await S.dl.save({filename, data:blob}); }
    else await h2p().set(Object.assign(opts, {filename})).from(copy).save();
  } catch (err) { if (err?.code !== 'declined') toast('Couldn’t create the file. Use “Save as PDF / Print” instead.'); }
  box.remove(); btn.disabled = false; btn.textContent = old;
}
boot();
</script>
